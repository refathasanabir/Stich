{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Portal | StitchSync{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0A192F',
                        gold: '#D4AF37',
                        'gold-soft': '#f4ecd0',
                        charcoal: "#212529",
                        slate: "#6C757D",
                        success: "#10B981",
                        warning: "#F59E0B",
                        error: "#EF4444",
                        info: "#3B82F6",
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen font-[Inter]">

    <!-- ================= CUSTOMER HEADER ================= -->
    {% include 'components/customer_header.html' %}

    <!-- ================= CUSTOMER CONTENT ================= -->
    <main class="flex-1 max-w-[1200px] w-full mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- ================= FOOTER ================= -->
    {% include 'components/footer.html' %}

    <script>
        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
