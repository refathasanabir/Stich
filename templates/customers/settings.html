{% extends 'base/base.html' %}
{% load static %}

{% block title %}Account Settings | StitchSync{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-bold text-navy font-serif">Account Settings</h1>
    <p class="text-gray-500 text-sm mt-1">Manage your profile information and security preferences.</p>
</div>

<div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm max-w-xl">
    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" class="w-full px-4 py-2 border border-gray-200 rounded-xl bg-gray-50 text-gray-500" value="{{ request.user.username }}" disabled>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-navy" value="{{ request.user.email|default:'customer@example.com' }}">
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <input type="password" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-navy" placeholder="Leave blank to keep current password">
        </div>
        <button type="submit" class="py-3 px-6 bg-navy text-white rounded-xl font-medium hover:bg-slate-800 transition">Save Changes</button>
    </form>
</div>
{% endblock %}
