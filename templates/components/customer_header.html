<header class="bg-[#0A192F] text-white py-3.5 px-6 flex items-center justify-between border-b border-white/10 shadow-sm sticky top-0 z-50">
  
  <!-- Left: Brand Logo -->
  <div class="flex items-center">
    <a href="{% url 'core:marketplace' %}" class="font-serif text-xl font-bold tracking-wide flex items-center gap-2">
      <span>StitchSync</span>
      <span class="text-[10px] bg-white/10 text-gold px-2 py-0.5 rounded-md uppercase tracking-wider font-sans font-semibold">Customer</span>
    </a>
  </div>

  <!-- Center: Reordered Navigation (Marketplace first, Shops second, Dashboard last) -->
  <nav class="hidden md:flex items-center justify-center gap-6 text-sm font-medium text-white/80 absolute left-1/2 -translate-x-1/2">
    <a href="{% url 'core:marketplace' %}" class="hover:text-white transition">Marketplace</a>
    <a href="{% url 'customers:shops' %}" class="hover:text-white transition">Shops</a>
    <a href="{% url 'customers:orders' %}" class="hover:text-white transition">Orders</a>
    <a href="{% url 'customers:cart' %}" class="hover:text-white transition flex items-center gap-1">
      Cart 🛒
    </a>
    <a href="{% url 'customers:chat' %}" class="hover:text-white transition">Messages</a>
    <a href="{% url 'customers:dashboard' %}" class="hover:text-white transition">Dashboard</a>
  </nav>

  <!-- Right Side: User Account Dropdown -->
  <div class="flex items-center relative">
    <details class="group relative">
      <summary class="flex items-center gap-2.5 py-1.5 px-3 rounded-xl bg-white/5 hover:bg-white/10 transition border border-white/10 text-sm font-medium cursor-pointer list-none select-none">
        <span class="w-7 h-7 rounded-full bg-gold text-navy font-bold grid place-items-center text-xs">
          {{ request.user.username|slice:":1"|upper }}
        </span>
        <span class="text-white">{{ request.user.username }}</span>
        <svg class="w-4 h-4 text-white/60 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </summary>

      <!-- Dropdown Menu Box -->
      <div class="absolute right-0 mt-2 w-52 bg-[#FDFBF7] text-gray-800 rounded-2xl shadow-xl border border-gray-200/80 p-2 z-50 text-sm space-y-1">
        
        <!-- Header Info -->
        <div class="px-3 py-2.5 border-b border-gray-200/60 mb-1">
          <div class="font-bold text-navy truncate">{{ request.user.username }}</div>
          <div class="text-[11px] text-gray-500 truncate">Customer Account</div>
        </div>

        <!-- Links -->
        <a href="{% url 'customers:profiles' %}" class="flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-navy/5 text-navy transition font-medium">
          📐 Measurement Profiles
        </a>
        <a href="{% url 'customers:settings' %}" class="flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-navy/5 text-navy transition font-medium">
          ⚙️ Account Settings
        </a>

        <!-- Logout Action Button -->
        <div class="pt-2 mt-1 border-t border-gray-200/60">
          <a href="/logout/" class="flex items-center justify-center gap-2 w-full py-2.5 px-3 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 transition font-semibold text-xs tracking-wide uppercase">
            🚪 Logout
          </a>
        </div>

      </div>
    </details>
  </div>
</header>
