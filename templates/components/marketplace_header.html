<header class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-[1200px] mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <a href="{% url 'core:home' %}" class="font-serif font-bold text-xl tracking-wide text-navy">StitchSync</a>
            <span class="text-xs bg-gold/20 text-yellow-800 px-2 py-1 rounded-md font-semibold">Marketplace Directory</span>
        </div>
        
        <!-- Search bar specific to marketplace -->
        <div class="hidden md:flex items-center flex-1 max-w-md mx-8">
            <input type="text" placeholder="Search custom panjabis, suits, tailors..." class="w-full px-4 py-1.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-navy/50">
        </div>

        <div class="flex items-center gap-3">
            {% if request.user.is_authenticated %}
                <a href="{% url 'customers:dashboard' %}" class="text-sm font-medium text-navy hover:underline">My Dashboard</a>
            {% else %}
                <a href="{% url 'core:login' %}" class="text-sm font-medium text-navy">Login</a>
                <a href="{% url 'core:register' %}" class="text-sm font-medium bg-navy text-white px-3 py-1.5 rounded-lg">Sign Up</a>
            {% endif %}
        </div>
    </div>
</header>
