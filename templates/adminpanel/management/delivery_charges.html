{% extends "adminpanel/base.html" %}

{% block title %}Delivery Charge Rules | StitchSync Admin{% endblock %}

{% block content %}

<section class="max-w-[1200px] mx-auto px-4 py-8">

    <div class="flex justify-between items-start mb-6">

        <div>

            <h1 class="font-[Playfair_Display] text-3xl font-bold text-[#0A192F]">
                Delivery Charge Rules
            </h1>

            <p class="text-sm text-gray-500 mt-1">
                Configure platform-wide delivery pricing.
            </p>

        </div>

        <button form="deliveryForm"
                class="px-5 py-3 rounded-lg bg-[#0A192F] text-white font-semibold">
            Save Changes
        </button>

    </div>


    <form id="deliveryForm"
          method="POST"
          class="bg-white rounded-xl border border-gray-200 p-6 max-w-2xl">

        {% csrf_token %}

        <div class="space-y-6">

            <div>

                <label class="block text-sm font-semibold mb-2">
                    Base Delivery Charge ($)
                </label>

                <input type="number"
                       step="0.01"
                       name="base_charge"
                       value="{{ rule.charge }}"
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg">

            </div>


            <div>

                <label class="block text-sm font-semibold mb-2">
                    Charge per extra KM ($)
                </label>

                <input type="number"
                       step="0.01"
                       name="extra_km_charge"
                       value="{{ rule.extra_km_charge }}"
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg">

                <p class="text-xs text-gray-500 mt-2">
                    Applied beyond the first 3 km.
                </p>

            </div>


            <div>

                <label class="block text-sm font-semibold mb-2">
                    Free Delivery Threshold ($)
                </label>

                <input type="number"
                       step="0.01"
                       name="free_delivery_threshold"
                       value="{{ rule.min_order_amount }}"
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg">

                <p class="text-xs text-gray-500 mt-2">
                    Orders above this amount ship free.
                </p>

            </div>


            <div>

                <label class="block text-sm font-semibold mb-2">
                    Fabric Pickup Charge ($)
                </label>

                <input type="number"
                       step="0.01"
                       name="fabric_pickup_charge"
                       value="{{ rule.fabric_pickup_charge }}"
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg">

            </div>

        </div>

    </form>

</section>

{% endblock %}
